name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check generated icon pack is up to date
        run: |
          python3 tools/icons/generate_icons.py
          git diff --exit-code -- glassicons/src/main/res glassicons/src/main/assets/appfilter.xml

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APKs (Glass Launcher + Glass Icons)
        run: ./gradlew --no-daemon :app:assembleDebug :glassicons:assembleDebug

      - name: Upload Glass Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Glass Icons APK
        uses: actions/upload-artifact@v4
        with:
          name: glassicons-debug
          path: glassicons/build/outputs/apk/debug/glassicons-debug.apk
          if-no-files-found: error
