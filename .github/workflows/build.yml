name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    needs: emulator-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g -XX:ActiveProcessorCount=2" -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:lintDebug

      - name: Assemble Glass Launcher release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g -XX:ActiveProcessorCount=2" -Pkotlin.compiler.execution.strategy=in-process :app:assembleRelease

      - name: Upload Glass Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: glass-launcher
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

  emulator-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Emulator regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 1536 -cores 2
          script: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g -XX:ActiveProcessorCount=2" -Pkotlin.compiler.execution.strategy=in-process :app:connectedDebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/connected_android_test_additional_output/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
